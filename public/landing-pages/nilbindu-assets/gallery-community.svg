<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>
    <linearGradient id="stationGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19232c"/>
      <stop offset="100%" stop-color="#0e1419"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Top Badge -->
  <rect x="50" y="46" width="180" height="28" rx="14" fill="#0c1117" stroke="#e0231c" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="68" cy="60" r="4" fill="#e0231c"/>
  <text x="82" y="64" fill="#dfe7e0" font-family="'Onest', sans-serif" font-size="10" font-weight="500" letter-spacing="2">FIELD DEPLOYMENT</text>

  <!-- Community Station Blueprint / Structure Illustration -->
  <g transform="translate(180, 110)">
    <!-- Base Platform -->
    <rect x="40" y="240" width="360" height="20" rx="4" fill="#1b252e" stroke="#dfe7e0" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- Support Columns -->
    <rect x="80" y="100" width="14" height="140" fill="#24303b"/>
    <rect x="346" y="100" width="14" height="140" fill="#24303b"/>

    <!-- Dual Overhead Storage Reservoirs -->
    <rect x="70" y="40" width="140" height="80" rx="10" fill="url(#stationGrad)" stroke="#dfe7e0" stroke-width="1.2" stroke-opacity="0.3"/>
    <text x="140" y="85" fill="#aab4ad" font-family="'Onest', sans-serif" font-size="11" letter-spacing="1.5" text-anchor="middle">RAW TANK</text>

    <rect x="230" y="40" width="140" height="80" rx="10" fill="url(#stationGrad)" stroke="#38b6db" stroke-width="1.2" stroke-opacity="0.5"/>
    <text x="300" y="85" fill="#38b6db" font-family="'Onest', sans-serif" font-size="11" letter-spacing="1.5" text-anchor="middle">FILTERED</text>

    <!-- Center Filtration Vessel -->
    <rect x="180" y="140" width="80" height="100" rx="6" fill="#11181f" stroke="#e0231c" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="220" cy="190" r="16" fill="#e0231c" fill-opacity="0.15" stroke="#e0231c" stroke-width="1"/>
    <path d="M220 178 L220 202 M208 190 L232 190" stroke="#e0231c" stroke-width="1.5"/>

    <!-- Gravity Pipes -->
    <path d="M140 120 L140 160 L180 160" fill="none" stroke="#dfe7e0" stroke-width="2" stroke-opacity="0.4"/>
    <path d="M260 210 L300 210 L300 120" fill="none" stroke="#38b6db" stroke-width="2" stroke-opacity="0.7"/>

    <!-- Community Maintenance Access Indicator -->
    <g transform="translate(140, 275)" font-family="'Onest', sans-serif">
      <circle cx="0" cy="0" r="3" fill="#e0231c"/>
      <text x="12" y="4" fill="#aab4ad" font-size="10" letter-spacing="1">LOCAL OPERATOR STEWARDSHIP &amp; MAINTENANCE ACCESS</text>
    </g>
  </g>

  <text x="50" y="450" fill="#aab4ad" font-family="'Onest', sans-serif" font-size="12" letter-spacing="0.5">Community-Integrated Gravity Filtration Installation &amp; Storage Architecture</text>
</svg>
