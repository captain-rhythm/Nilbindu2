<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>
    <linearGradient id="metricCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e12" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a7288"/>
      <stop offset="100%" stop-color="#38b6db"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Wave Graph Lines Background -->
  <path d="M0 260 Q 200 230, 400 260 T 800 260" fill="none" stroke="#297c9b" stroke-width="1.5" opacity="0.2"/>
  <path d="M0 280 Q 200 310, 400 280 T 800 280" fill="none" stroke="#dfe7e0" stroke-width="1" opacity="0.08"/>

  <!-- Top Badge -->
  <rect x="50" y="46" width="180" height="28" rx="14" fill="#0c1117" stroke="#e0231c" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="68" cy="60" r="4" fill="#e0231c"/>
  <text x="82" y="64" fill="#dfe7e0" font-family="'Onest', sans-serif" font-size="10" font-weight="500" letter-spacing="2">LABORATORY &amp; FIELD</text>

  <!-- Left: Test Flask / Vial Visualization -->
  <g transform="translate(140, 120)">
    <!-- Flask 1: Raw Sample -->
    <path d="M40 50 L40 90 L10 190 A 20 20 0 0 0 26 216 L74 216 A 20 20 0 0 0 90 190 L60 90 L60 50 Z" fill="none" stroke="#dfe7e0" stroke-width="1.5" stroke-opacity="0.4"/>
    <path d="M18 190 A 16 16 0 0 0 26 210 L74 210 A 16 16 0 0 0 82 190 L62 130 L38 130 Z" fill="#6d5832" opacity="0.45"/>
    <text x="50" y="240" fill="#aab4ad" font-family="'Onest', sans-serif" font-size="10" letter-spacing="1.5" text-anchor="middle">PRE-FILTRATION</text>

    <!-- Arrow -->
    <path d="M120 145 L150 145" stroke="#dfe7e0" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="3 3"/>
    <polygon points="152,145 146,141 146,149" fill="#dfe7e0" opacity="0.4"/>

    <!-- Flask 2: Pure Output -->
    <g transform="translate(140, 0)">
      <path d="M40 50 L40 90 L10 190 A 20 20 0 0 0 26 216 L74 216 A 20 20 0 0 0 90 190 L60 90 L60 50 Z" fill="none" stroke="#38b6db" stroke-width="1.8" stroke-opacity="0.8"/>
      <path d="M18 190 A 16 16 0 0 0 26 210 L74 210 A 16 16 0 0 0 82 190 L62 120 L38 120 Z" fill="#25829e" opacity="0.6"/>
      <circle cx="50" cy="165" r="4" fill="#38b6db" opacity="0.8"/>
      <text x="50" y="240" fill="#38b6db" font-family="'Onest', sans-serif" font-size="10" letter-spacing="1.5" text-anchor="middle">TEST PASSED</text>
    </g>
  </g>

  <!-- Right: Metrics Console Cards -->
  <g transform="translate(420, 110)">
    <!-- Metric 1: Turbidity -->
    <rect x="0" y="0" width="310" height="74" rx="8" fill="url(#metricCard)" stroke="#dfe7e0" stroke-width="1" stroke-opacity="0.15"/>
    <text x="24" y="32" fill="#78837c" font-family="'Onest', sans-serif" font-size="10" letter-spacing="2">TURBIDITY INDEX</text>
    <text x="24" y="58" fill="#dfe7e0" font-family="'Onest', sans-serif" font-size="20" font-weight="400">NTU &lt; 1.0</text>
    <text x="286" y="52" fill="#38b6db" font-family="'Onest', sans-serif" font-size="11" text-anchor="end">CLEAR TARGET</text>

    <!-- Metric 2: pH Equilibrium -->
    <rect x="0" y="88" width="310" height="74" rx="8" fill="url(#metricCard)" stroke="#dfe7e0" stroke-width="1" stroke-opacity="0.15"/>
    <text x="24" y="120" fill="#78837c" font-family="'Onest', sans-serif" font-size="10" letter-spacing="2">pH EQUILIBRIUM</text>
    <text x="24" y="146" fill="#dfe7e0" font-family="'Onest', sans-serif" font-size="20" font-weight="400">6.8 — 7.4 pH</text>
    <text x="286" y="140" fill="#38b6db" font-family="'Onest', sans-serif" font-size="11" text-anchor="end">BALANCED</text>

    <!-- Metric 3: Total Dissolved Solids -->
    <rect x="0" y="176" width="310" height="74" rx="8" fill="url(#metricCard)" stroke="#dfe7e0" stroke-width="1" stroke-opacity="0.15"/>
    <text x="24" y="208" fill="#78837c" font-family="'Onest', sans-serif" font-size="10" letter-spacing="2">TOTAL DISSOLVED SOLIDS</text>
    <text x="24" y="234" fill="#dfe7e0" font-family="'Onest', sans-serif" font-size="20" font-weight="400">TDS OPTIMIZED</text>
    <text x="286" y="228" fill="#38b6db" font-family="'Onest', sans-serif" font-size="11" text-anchor="end">SAFE BRACKET</text>
  </g>

  <text x="50" y="450" fill="#aab4ad" font-family="'Onest', sans-serif" font-size="12" letter-spacing="0.5">Dual-Phase Water Quality Testing &amp; Analytical Parameter Monitoring</text>
</svg>
